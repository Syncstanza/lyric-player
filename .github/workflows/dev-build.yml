name: Dev build
# Early versions from the dev branch. They are the real app (same name, same settings, same signing key), published as
# PRE-RELEASES under their own tags (android-dev, windows-dev, linux-dev). Nothing offers them by default: a person has to
# turn on Menu > "Early versions" in the app, and then the app updates itself from these instead of the normal releases.
# The normal releases (latest, windows-latest, linux-latest) are not touched.
on:
  push:
    branches: [dev]
    paths-ignore: ['**/*.md', 'docs/**', 'announcements.json']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Stamp this build
        run: |
          V="1.0.$GITHUB_RUN_NUMBER-dev"
          printf 'window.__build = { sha: "%s", platform: "phone", version: "%s" };\n' "$GITHUB_SHA" "$V" > app/src/phone/assets/renderer/build-info.js
          printf 'window.__build = { sha: "%s", platform: "tv", version: "%s" };\n' "$GITHUB_SHA" "$V" > app/src/tv/assets/renderer/build-info.js
      - name: Build the APKs
        run: |
          export LP_VERSION_CODE=$(( $(date +%s) / 60 ))
          export LP_VERSION_SUFFIX=-dev
          gradle --no-daemon --stacktrace assemblePhoneDebug assembleTvDebug
      - name: Name the files
        run: |
          cp app/build/outputs/apk/phone/debug/app-phone-debug.apk LyricPlayer.apk
          cp app/build/outputs/apk/tv/debug/app-tv-debug.apk LyricPlayer-TV.apk
      - name: Publish as the "android-dev" pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-dev --yes --cleanup-tag || true
          gh release create android-dev LyricPlayer.apk LyricPlayer-TV.apk --prerelease --title "Lyric Player EARLY VERSION (Android)" --notes "An early version from the dev branch, for people who turned on Early versions in the app. It can have bugs. It installs over the normal app (same settings). LyricPlayer.apk is for phones and Android Auto, LyricPlayer-TV.apk for Google TV." --target "$GITHUB_SHA"

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Stamp this build
        shell: bash
        run: |
          V="1.0.$GITHUB_RUN_NUMBER-dev"
          printf 'window.__build = { sha: "%s", platform: "windows", version: "%s" };\n' "$GITHUB_SHA" "$V" > windows/renderer/build-info.js
          (cd windows && npm version "$V" --no-git-tag-version --allow-same-version)
      - name: Install, test, build the installer and the portable .exe
        working-directory: windows
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm install
          npm test
          npm run dist
      - name: Publish as the "windows-dev" pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for f in windows/dist/Lyric-Player-*.exe; do sha256sum "$f" | cut -d' ' -f1 > "$f.sha256"; done
          gh release delete windows-dev --yes --cleanup-tag || true
          gh release create windows-dev windows/dist/Lyric-Player-*.exe windows/dist/Lyric-Player-*.exe.sha256 --prerelease --title "Lyric Player EARLY VERSION (Windows)" --notes "An early version from the dev branch, for people who turned on Early versions in the app. It can have bugs. Lyric-Player-Setup-<version>.exe installs it, Lyric-Player-<version>.exe is the portable app." --target "$GITHUB_SHA"

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Stamp this build
        shell: bash
        run: |
          V="1.0.$GITHUB_RUN_NUMBER-dev"
          printf 'window.__build = { sha: "%s", platform: "linux", version: "%s" };\n' "$GITHUB_SHA" "$V" > windows/renderer/build-info.js
          (cd windows && npm version "$V" --no-git-tag-version --allow-same-version)
      - name: Install, test, build the .deb and AppImage
        working-directory: windows
        shell: bash
        run: |
          npm install
          npm test
          npm run dist:linux
      - name: Publish as the "linux-dev" pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for f in windows/dist/Lyric-Player-*.AppImage; do sha256sum "$f" | cut -d' ' -f1 > "$f.sha256"; done
          gh release delete linux-dev --yes --cleanup-tag || true
          gh release create linux-dev windows/dist/Lyric-Player-*.deb windows/dist/Lyric-Player-*.AppImage windows/dist/Lyric-Player-*.AppImage.sha256 --prerelease --title "Lyric Player EARLY VERSION (Linux)" --notes "An early version from the dev branch, for people who turned on Early versions in the app. It can have bugs." --target "$GITHUB_SHA"
